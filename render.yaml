services:
  - type: web
    name: small-business-ai-automation
    env: node
    plan: free
    buildCommand: ""
    startCommand: "npm start"
    healthCheckPath: "/api/health"
    envVars:
      - key: HOST
        value: "0.0.0.0"
      - key: DATA_DIR
        value: "/tmp/xiaofei-ai-data"
      - key: OPENAI_MODEL
        value: "gpt-4.1-mini"
      - key: PLATFORM_PASSWORD
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
