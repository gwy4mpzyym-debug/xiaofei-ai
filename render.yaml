services:
  - type: web
    name: small-business-ai-automation
    env: node
    plan: starter
    buildCommand: ""
    startCommand: "npm start"
    healthCheckPath: "/api/health"
    disk:
      name: app-data
      mountPath: "/var/data"
      sizeGB: 1
    envVars:
      - key: HOST
        value: "0.0.0.0"
      - key: DATA_DIR
        value: "/var/data"
      - key: OPENAI_MODEL
        value: "gpt-4.1-mini"
      - key: PLATFORM_PASSWORD
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
